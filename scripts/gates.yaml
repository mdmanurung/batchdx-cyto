      2-D gating, the per-panel asinh transform, the PeacoQC pass and a `removed_events`
      writer are implemented in `src/batchdx/cyto/preprocess/` and tested against the
      pinned reference implementation's OWN configuration files, which load unchanged; the
      transform is verified element-wise against `flowVS::transFlowVS`, and `logicle` was
      removed from the schema because nothing here implements it. NOT satisfied: none of
      it is wired into a run. `preprocess` operates on raw events before a baseline exists,
      so there is no preprocessing stage, no Snakemake rule and no report section for the
      removal log, and every shipped example takes the already-QCed bypass path. A run must
      therefore still be handed preprocessed data, which is the behaviour this package
      documents. See docs/blocked.md B-009.

