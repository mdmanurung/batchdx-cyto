      `decisions/policy.py` refuses to let a contrast that only the training split can
      estimate support a recommendation
      (test_a_contrast_only_the_training_split_can_estimate_blocks_approval). NOT
      satisfied: the 60/20/20 proportions are uncalibrated engineering defaults with a
      declared origin, and they are not configurable by a user. On a design too thin to
      stratify the manifest is emitted with the deficiency reported as a coverage
      warning rather than refused, because refusing would take the detectors, metrics
      and report down with it; the fit-and-apply backend still refuses such a design
      itself.

