# SLURM execution profile.
#
# STATUS: UNTESTED. This profile has never been executed on a cluster in this build.
# It is provided as a starting point and is labelled untested deliberately; do not cite
# it as evidence of cluster support. A dry run is not execution validation.
#
# What HAS been measured (2026-10-16): with snakemake 9.27 and
# snakemake-executor-plugin-slurm installed, `snakemake --lint` over this profile
# passes with no errors or warnings, and the profile parses. That is a syntax and
# schema check only -- it says nothing about whether a SLURM scheduler accepts the
# submitted jobs, which is what UNTESTED here still means.
#
# Requires the SLURM executor plugin:
#     pip install snakemake-executor-plugin-slurm
executor: slurm
jobs: 32
keep-going: true
rerun-incomplete: true
latency-wait: 60
# The two values below are site-specific and are left as REPLACE_ME on purpose. There is
# no correct value to hard-code: a partition name and an account string are properties of
# one cluster, and a default that is wrong for every reader is worse than a placeholder
# that cannot be mistaken for one. Every other resource here is a stated number.
#
# Snakemake maps each top-level key of this file onto the matching command line flag
# (`executor: slurm` becomes `--executor slurm`, `default-resources:` becomes
# `--default-resources ...`; see `snakemake --help`), so this profile cannot do anything
# useful until both are replaced. Replace them in your own copy, and keep this one
# UNTESTED.
default-resources:
  slurm_partition: "REPLACE_ME"
  slurm_account: "REPLACE_ME"
  mem_mb: 8000
  runtime: 120
set-resources:
  correct:
    mem_mb: 64000
    runtime: 480
    cpus_per_task: 8
  metrics:
    mem_mb: 32000
    runtime: 240
    cpus_per_task: 4

# Two operational notes, deliberately kept as notes rather than turned into directives,
# because neither has a directive in this file to turn into. An earlier revision ended
# with a trailing comment and nothing after it, which read as though a directive had been
# dropped; that ambiguity is what is being removed here.
#
#   * There is no login-node guard in this profile, and this build cannot add one. What
#     constrains a job to non-login nodes is the partition named in default-resources
#     above, so choose a partition that excludes them. A job submitted to a partition
#     that includes login nodes will run there.
#   * A job body is a one-line call into batchdx.cyto.pipeline that writes nothing outside
#     `outdir`, so the profile assumes no shared filesystem beyond the working directory
#     and no privileges the submitter does not already have.
