# Tests for the batchdx-cyto package.
#
# The repository also carries a cookiecutter template with its own workflow
# (.github/workflows/test.yml); the two are independent.
name: batchdx-cyto tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Named distinctly from the cookiecutter template's job, which is also called
  # "test"; two identically named checks on one PR are unreadable.
  batchdx-cyto:
    runs-on: ubuntu-latest
    # Raised from 45 because this job now builds a full R environment before it tests
    # anything. 45 minutes did not have room for the solver download plus the source
    # builds of cyCombine and CytoNorm on top of the suite, and a timeout would look
    # exactly like a test failure. Not measured on a runner; it is a budget, not a
    # measurement.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install micromamba
        # scripts/setup_r_env.sh builds the R environment with micromamba rather than
        # install.packages(), because a solver resolves the closure to prebuilt packages
        # built against one toolchain. On the machine this repository was developed on
        # the direct CRAN route fails outright (gcc 8.5 provides GLIBCXX_3.4.25 and R 4.4
        # needs _3.4.29), so the solver route is the one the script implements and the
        # one CI has to use too. Installing micromamba here rather than switching to
        # apt/CRAN keeps one authority for the R dependency set: the script.
        #
        # NOT EXECUTED: this workflow has never been run. No GitHub runner was available,
        # so "the R layer runs in CI" is a claim read from YAML until someone pushes a
        # branch. Everything below is written to be checkable by that first run.
        run: |
          set -euo pipefail
          curl -sSL https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xj -C "$RUNNER_TEMP" bin/micromamba
          "$RUNNER_TEMP/bin/micromamba" --version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "MAMBA_BIN=$RUNNER_TEMP/bin/micromamba" >> "$GITHUB_ENV"

      - name: Build the R environment
        # The script exits non-zero if a required R package is absent, so a broken build
        # fails here rather than turning into a pile of skips in the test step below.
        # pipefail is what makes the tee'd build fail the step rather than the log.
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/setup_r_env.sh "$RUNNER_TEMP/r-env" 2>&1 | tee build/r-env.log

      - name: Put the built R environment on PATH
        # R_LIBS is derived from the interpreter rather than written as a literal path, so
        # a change to the prefix layout cannot silently point R at an empty library and
        # turn every R-backed test into a skip.
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/r-env/bin" >> "$GITHUB_PATH"
          r_lib="$("$RUNNER_TEMP/r-env/bin/Rscript" --vanilla -e 'cat(.libPaths()[1])')"
          echo "R_LIBS=$r_lib" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/r-env/bin/Rscript" --vanilla -e \
            'cat(R.version.string, "\n"); cat(.libPaths(), sep = "\n"); for (p in c("cyCombine","CytoNorm","PeacoQC","flowVS")) cat(p, requireNamespace(p, quietly=TRUE), "\n")'

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: R exchange suite
        run: |
          BATCHDX_PYTHON="$(command -v python)" Rscript --vanilla tests/run_r_tests.R

      - name: Fetch pinned upstream checkouts
        run: bash scripts/fetch_upstream.sh .upstream

      - name: Lint
        run: ruff check src tests scripts

      - name: Lint the workflow
        # A valid --config is required because the Snakefile reads config["config"] at
        # parse time (workflow/Snakefile:24), not lazily inside a rule. Run locally with:
        #   snakemake --snakefile workflow/Snakefile --lint \
        #     --config config=config/example_paired_reference.yaml outdir=/tmp/lint base_dir=. mode=diagnose
        #
        # Executed locally against snakemake 9.27.0 on 2026-09-30: passes. Not executed
        # on a runner.
        run: |
          snakemake --snakefile workflow/Snakefile --lint \
            --config config=config/example_paired_reference.yaml \
            outdir="$RUNNER_TEMP/lint" base_dir=. mode=diagnose

      - name: Stage 0 upstream audit
        run: |
          mkdir -p docs/audit
          python  scripts/audit_upstream.py --upstream-dir .upstream --out docs/audit/audit_python.json
          Rscript scripts/audit_upstream.R docs/audit/audit_r.json .upstream config/upstream_lock.yaml

      - name: Tests
        run: |
          mkdir -p build
          pytest -q --json-report --json-report-file=build/report.json

      - name: Fail if the committed status document is stale
        # Regenerated into a scratch file and compared, ignoring the generation
        # timestamp, so the committed status cannot drift from the real test results.
        #
        # This gate is EXPECTED TO FAIL once the R layer above starts working, because
        # the skip counts it reports change: tests marked requires_r / requires_cycombine
        # / requires_cytonorm / requires_cytobatchflagr previously skipped in CI because
        # no R interpreter was installed, and now execute. Regenerate the document in an
        # environment that has the same R layer this job builds -- not on a machine
        # without one, or the numbers drift back -- and land that with this change. The
        # remedy is to regenerate the document, never to relax what is compared here.
        shell: bash
        run: |
          python scripts/generate_status.py --report build/report.json --out build/status.md
          if ! diff -u <(grep -v '^Derived by' docs/implementation_status.md) \
                       <(grep -v '^Derived by' build/status.md); then
            echo
            echo "docs/implementation_status.md is out of date with the test results."
            echo "Regenerate it and commit the result:"
            echo "  pytest --json-report --json-report-file=build/report.json"
            echo "  python scripts/generate_status.py --report build/report.json"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-and-audit
          path: |
            build/report.json
            build/status.md
            build/r-env.log
            docs/audit/
