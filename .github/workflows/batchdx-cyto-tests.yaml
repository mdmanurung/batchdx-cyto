# Tests for the batchdx-cyto package.
#
# The repository also carries a cookiecutter template with its own workflow
# (.github/workflows/test.yml); the two are independent.
name: batchdx-cyto tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Named distinctly from the cookiecutter template's job, which is also called
  # "test"; two identically named checks on one PR are unreadable.
  batchdx-cyto:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install R
        # Two Stage 0 audit tests and the Python/R contract round trip need an R
        # interpreter. They skip cleanly without one; installing it means they run.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-jsonlite

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Fetch pinned upstream checkouts
        # Source-level audit only; no R package is installed from CRAN or Bioconductor,
        # so the R-backed adapters stay unavailable and their tests skip visibly.
        run: bash scripts/fetch_upstream.sh .upstream

      - name: Lint
        run: ruff check src tests scripts

      - name: Stage 0 upstream audit
        run: |
          mkdir -p docs/audit
          python  scripts/audit_upstream.py --upstream-dir .upstream --out docs/audit/audit_python.json
          Rscript scripts/audit_upstream.R docs/audit/audit_r.json .upstream config/upstream_lock.yaml

      - name: Tests
        run: |
          mkdir -p build
          pytest -q --json-report --json-report-file=build/report.json

      - name: Fail if the committed status document is stale
        # Regenerated into a scratch file and compared, ignoring the generation
        # timestamp, so the committed status cannot drift from the real test results.
        shell: bash
        run: |
          python scripts/generate_status.py --report build/report.json --out build/status.md
          if ! diff -u <(grep -v '^Derived by' docs/implementation_status.md) \
                       <(grep -v '^Derived by' build/status.md); then
            echo
            echo "docs/implementation_status.md is out of date with the test results."
            echo "Regenerate it and commit the result:"
            echo "  pytest --json-report --json-report-file=build/report.json"
            echo "  python scripts/generate_status.py --report build/report.json"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-and-audit
          path: |
            build/report.json
            build/status.md
            docs/audit/
