site_name: batchdx-cyto
site_description: >
  Batch-effect diagnosis, correction and evaluation for mass cytometry,
  conventional flow cytometry and spectral flow cytometry, orchestrated by Snakemake.
site_url: https://mdmanurung.github.io/batchdx-cyto/
repo_url: https://github.com/mdmanurung/batchdx-cyto
repo_name: mdmanurung/batchdx-cyto

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details

# The repository's docs/ tree doubles as the internal development record.  The
# published site carries the curated subset below; everything else stays internal.
exclude_docs: |
  audit/
  plans/
  releases/
  blocked.md
  upstream_audit.md
  README.md

nav:
  - Home: index.md
  - User guide:
      - usage.md
  - Vignettes:
      - vignettes/quickstart.md
      - vignettes/confounded.md
      - vignettes/spectral_controls.md
  - Design decisions:
      - decisions/0001-internal-data-contract.md
      - decisions/0002-python-r-boundary.md
      - decisions/0003-cytobatchflagr-integration.md
      - decisions/0004-dependency-isolation.md
      - decisions/0005-evaluation-partitions.md
      - decisions/0006-candidate-results-and-failure-handling.md
  - Validation:
      - validation_results.md
      - compatibility_matrix.md
      - implementation_status.md
  - API reference:
      - api/index.md
      - Pipeline & orchestration: api/pipeline.md
      - Command line: api/cli.md
      - Configuration: api/config.md
      - Input / output: api/io.md
      - Preprocessing: api/preprocess.md
      - Design audit: api/design.md
      - Diagnostics: api/diagnostics.md
      - Correction backends: api/adapters.md
      - Sampling & partitions: api/sampling.md
      - Metrics: api/metrics.md
      - Decisions: api/decisions.md
      - Reporting: api/reporting.md
      - Schemas & contracts: api/schemas.md
      - Simulation & examples: api/simulate.md
