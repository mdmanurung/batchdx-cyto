[project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]
description = "Batch-effect diagnostics and correction for cytometry, with an honest decision policy"
name = "batchdx-cyto"
version = "0.1.0"

[dependencies]
python = ">=3.11"
numpy = "*"
pandas = "*"
anndata = "*"
pydantic = ">=2"
pyyaml = "*"
jinja2 = "*"
pulp = "*"
typer = "*"
scipy = "*"
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
snakemake = "*"
r-base = ">=4.2"

[tasks]
test = "python -m pytest tests/unit tests/integration tests/scientific -q"
test-unit = "python -m pytest tests/unit -q"
