[project]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]
description = "Cookiecutter template for Python data science projects"
version = "0.1.0"

[dependencies]
python = ">=3.10"
pytest = "*"
pytest-cov = "*"
pyyaml = "*"
toml = "*"
cookiecutter = "*"

[tasks]
# Scoped to the cookiecutter template's own tests. The batchdx-cyto suites live in
# tests/{unit,integration,scientific} and need the package installed; they are run by
# .github/workflows/batchdx-cyto-tests.yaml instead.
test = "pytest tests/test_template_bake.py tests/test_post_gen_hook.py -v"
test-cov = "pytest tests/test_template_bake.py tests/test_post_gen_hook.py --cov=. --cov-report=term-missing"
