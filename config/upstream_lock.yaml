# Upstream lock manifest (Stage 0).
#
# Every commit below was resolved by cloning the repository and reading
# `git rev-parse HEAD` on 2026-09-14; the licence fields were read from the LICENSE
# file in that checkout.  `adapter_calls` lists exactly the functions this package's
# adapters call.  `scripts/audit_upstream.R` and `scripts/audit_upstream.py` check
# every name in those lists against the pinned sources and fail if one is missing.
#
# Refresh the checkouts with `scripts/fetch_upstream.sh`.

schema_version: 1
resolved_on: "2026-09-14"

resources:

  cycombine:
    repository: https://github.com/biosurf/cyCombine
    commit: fcd42dbbe92bfa6bffa6094bf9b4de536e71c249
    branch: master
    version: "0.3.0"
    language: R
    distribution: R package (GitHub only; not on CRAN or Bioconductor)
    licence: MIT
    licence_file: LICENSE.md
    licence_allows_reuse: true
    adapter_strategy: >-
      Call the installed package from a separate R process.  Nothing is vendored.
      The correction route is pinned to ComBat; ComBat_seq is refused by the adapter
      because it is a negative-binomial count model and transformed cytometry
      expression is not counts.
    adapter_calls:
      - normalize
      - create_som
      - correct_data
      - compute_emd
      - detect_batch_effect
      - detect_batch_effect_express
      - evaluate_emd
      - evaluate_mad
      - get_markers
    notes: >-
      detect_batch_effect restricts its EMD and cluster-percentage analysis to
      3 <= n_batches <= 30 and emits UMAPs alone outside that range.  Neither
      detect_batch_effect nor detect_batch_effect_express returns a structured value,
      so structured tables are produced by calling compute_emd directly.
    dependency_risk: >-
      Imports sva (Bioconductor) and kohonen (CRAN); neither is installable without
      CRAN and Bioconductor access, so a container image is required for a reproducible
      environment.

  cytonorm:
    repository: https://github.com/saeyslab/CytoNorm
    commit: 278f352d8edffd7a5d3e6b0b76c402d991a1e7a9
    branch: master
    version: "2.0.12"
    language: R
    distribution: R package (GitHub only)
    licence: GPL (>= 2)
    licence_file: DESCRIPTION
    licence_allows_reuse: false  # copying source into an MIT package would not be permissible
    adapter_strategy: >-
      Arm's-length invocation of the installed package from a separate R process, if and
      when the backend is implemented.  No source is copied.
    adapter_calls:
      - CytoNorm.train
      - CytoNorm.normalize
      - QuantileNorm.train
      - QuantileNorm.normalize
      - getCytoNormQuantiles
      - emdEvaluation
      - madEvaluation
    notes: >-
      CytoNorm.train(files, labels, channels, transformList, ...) and
      CytoNorm.normalize(model, ...) are separate, so fitting and application are
      genuinely separable.  Both operate on FCS *files*, not on data frames, which is
      why the backend needs a tested FCS round trip before it can be advertised.
    dependency_risk: >-
      Imports flowCore and FlowSOM (Bioconductor) plus emdist (CRAN).

  cytobatchflagr:
    repository: https://github.com/AndorfLab/CytoBatchFlagR
    former_repository: https://github.com/AndorfLab/cytoFlagR
    commit: ad21e3b104126783044351eb11fa24622a0da2f7
    branch: main
    version: "not versioned; scripts only"
    language: R
    distribution: R scripts (no DESCRIPTION, no NAMESPACE, not installable)
    licence: GPL-3.0
    licence_file: LICENSE
    licence_allows_reuse: false  # copyleft; incompatible with vendoring into this package
    adapter_strategy: >-
      source() the upstream scripts UNMODIFIED from a checkout the user supplies, in a
      separate R process, and call the analysis functions directly with configured
      values.  The upstream entry point (R/CytoBatchFlagR_workflow.R) is deliberately
      not sourced because it calls rstudioapi::selectDirectory and Shiny helpers.
      Nothing is copied or refactored into this package.
    adapter_calls:
      - neg_mfi_df_all
      - pos_mfi_df_all
      - percent_pos_df_all
      - iqr_dataframe
      - iqr_metric_function
      - detect_outlier
    notes: >-
      The three IQR metrics are computed per control sample per marker across batches;
      detect_outlier applies the 1.5 IQR Tukey fence.  A control sample must be present
      in every batch, and for n <= 3 values the fence can never be exceeded, so the
      assessment is degenerate below four batches.
    dependency_risk: >-
      Requires dplyr, tidyr, matrixStats, emdist, ggplot2 and many more CRAN packages;
      also ships Shiny helpers that this adapter never loads.

  openproblems_cyto_batch_integration:
    repository: https://github.com/openproblems-bio/task_cyto_batch_integration
    commit: "37151479aaa89edf37ae23068de8fbb41a1b7bb4"
    branch: main
    version: "unreleased (CHANGELOG header reads x.y.z)"
    language: Python and R, packaged as Viash components
    distribution: Viash components executed through Nextflow
    licence: MIT
    licence_file: LICENSE
    licence_allows_reuse: true
    adapter_strategy: >-
      Reference only in this build.  The metric implementations live inside Viash
      components with their own container and Nextflow runtime; extracting them without
      that runtime has not been attempted or verified here, so no metric in this package
      claims to be an upstream compatibility component.
    metrics_present_at_commit:
      - average_batch_r2_ct
      - emd_mean_ct_horiz
      - emd_mean_ct_vert
      - flowsom_mean_mapping_similarity
      - functional_marker_preservation_wilcoxon
      - functional_marker_preservation_cohens_d
      - iLisi
      - cLisi
      - ratio_consistent_peaks
    metrics_named_in_plan_but_absent:
      - name: cms
        detail: >-
          The CHANGELOG records "Added metrics/cms (PR #79)" and a later entry about
          parallelising it, but src/metrics/cms does not exist at this commit.  Treat
          the CellMixS-based metric as unavailable rather than as something to
          reconcile against.

  spiscy:
    repository: https://github.com/emilier17/spiscy
    commit: a6e55c8f722112bf01d5364996b1867844efbd02
    branch: main
    language: Snakemake workflow
    distribution: repository only; no release, no publication located
    licence: MIT
    licence_file: LICENSE
    licence_allows_reuse: true
    adapter_strategy: >-
      Reference reading for workflow layout and PeacoQC integration patterns.  No Tier A
      capability depends on it and nothing is built against it as a contract.
