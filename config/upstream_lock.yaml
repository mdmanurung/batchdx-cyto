# Upstream lock manifest (Stage 0).
#
# Every commit below was resolved by cloning the repository and reading
# `git rev-parse HEAD` on 2026-09-14; the licence fields were read from the LICENSE
# file in that checkout.  `adapter_calls` lists exactly the functions this package's
# adapters call.  `scripts/audit_upstream.R` and `scripts/audit_upstream.py` check
# every name in those lists against the pinned sources and fail if one is missing.
#
# Refresh the checkouts with `scripts/fetch_upstream.sh`.

schema_version: 1
resolved_on: "2026-09-14"

resources:

  cycombine:
    repository: https://github.com/biosurf/cyCombine
    commit: fcd42dbbe92bfa6bffa6094bf9b4de536e71c249
    branch: master
    version: "0.3.0"
    language: R
    distribution: R package (GitHub only; not on CRAN or Bioconductor)
    licence: MIT
    licence_file: LICENSE.md
    licence_allows_reuse: true
    adapter_strategy: >-
      Call the installed package from a separate R process.  Nothing is vendored.
      The correction route is pinned to ComBat; ComBat_seq is refused by the adapter
      because it is a negative-binomial count model and transformed cytometry
      expression is not counts.
    adapter_calls:
      - normalize
      - create_som
      - correct_data
      - compute_emd
      - detect_batch_effect
      - detect_batch_effect_express
      - evaluate_emd
      - evaluate_mad
      - get_markers
    notes: >-
      detect_batch_effect restricts its EMD and cluster-percentage analysis to
      3 <= n_batches <= 30 and emits UMAPs alone outside that range.  Neither
      detect_batch_effect nor detect_batch_effect_express returns a structured value,
      so structured tables are produced by calling compute_emd directly.
    dependency_risk: >-
      Imports sva (Bioconductor) and kohonen (CRAN); neither is installable without
      CRAN and Bioconductor access, so a container image is required for a reproducible
      environment.

  cytonorm:
    repository: https://github.com/saeyslab/CytoNorm
    commit: 278f352d8edffd7a5d3e6b0b76c402d991a1e7a9
    branch: master
    version: "2.0.12"
    language: R
    distribution: R package (GitHub only)
    licence: GPL (>= 2)
    licence_file: DESCRIPTION
    licence_allows_reuse: false  # copying source into an MIT package would not be permissible
    adapter_strategy: >-
      Arm's-length invocation of the installed package from a separate R process, if and
      when the backend is implemented.  No source is copied.
    adapter_calls:
      - CytoNorm.train
      - CytoNorm.normalize
      - QuantileNorm.train
      - QuantileNorm.normalize
      - getCytoNormQuantiles
      - emdEvaluation
      - madEvaluation
    notes: >-
      CytoNorm.train(files, labels, channels, transformList, ...) and
      CytoNorm.normalize(model, ...) are separate, so fitting and application are
      genuinely separable.  Both operate on FCS *files*, not on data frames.
      IMPLEMENTED (2026-09-29): the backend writes per-sample FCS carrying event
      identity in a dedicated BATCHDX_EVENT_IDX channel, fits on the training split's
      measured references only, normalises, and reads the files back; a reordered or
      dropped event refuses rather than matching.  Two findings from executing it are
      recorded in workflow/scripts/cytonorm_correct.R and adapters/cytonorm.py: the
      transform list must be pinned to the identity because the baseline is already
      transformed, and CytoNorm.normalize SKIPS a batch it has no fitted spline for and
      writes that file back unchanged, so "a file was written" and "the cells were
      corrected" are different claims and the result reports which samples were
      actually normalised.
    dependency_risk: >-
      Imports flowCore and FlowSOM (Bioconductor) plus emdist (CRAN).  Neither
      bioconductor-flowsom nor r-flowsom exists for a plain R install; scripts/setup_r_env.sh
      builds the environment with micromamba for that reason.

  cytobatchflagr:
    repository: https://github.com/AndorfLab/CytoBatchFlagR
    former_repository: https://github.com/AndorfLab/cytoFlagR
    commit: ad21e3b104126783044351eb11fa24622a0da2f7
    branch: main
    version: "not versioned; scripts only"
    language: R
    distribution: R scripts (no DESCRIPTION, no NAMESPACE, not installable)
    licence: GPL-3.0
    licence_file: LICENSE
    licence_allows_reuse: false  # copyleft; incompatible with vendoring into this package
    adapter_strategy: >-
      source() the upstream scripts UNMODIFIED from a checkout the user supplies, in a
      separate R process, and call the analysis functions directly with configured
      values.  The upstream entry point (R/CytoBatchFlagR_workflow.R) is deliberately
      not sourced because it calls rstudioapi::selectDirectory and Shiny helpers.
      Nothing is copied or refactored into this package.
    adapter_calls:
      - neg_mfi_df_all
      - pos_mfi_df_all
      - percent_pos_df_all
      - iqr_dataframe
      - iqr_metric_function
      - detect_outlier
    notes: >-
      The three IQR metrics are computed per control sample per marker across batches;
      detect_outlier applies the 1.5 IQR Tukey fence.  A control sample must be present
      in every batch, and for n <= 3 values the fence can never be exceeded, so the
      assessment is degenerate below four batches.
    dependency_risk: >-
      The binding set is not a DESCRIPTION (there is none) but the 29 unconditional
      library() calls at .upstream/CytoBatchFlagR/R/CytoBatchFlagR_functions.R:6-34:
      dplyr, scales, tidyr, reshape2, readxl, readr, matrixStats, ggplot2, ggpubr,
      ggridges, MASS, RColorBrewer, cowplot, limma, ggrepel, circlize, LaplacesDemon,
      tidyverse, ComplexHeatmap, flowCore, FlowSOM, ConsensusClusterPlus, pheatmap,
      Rtsne, umap, stats, progress, crayon, patchwork.  They are unconditional, so a
      single missing package aborts the whole source() rather than degrading one
      function; `library()` is not wrapped in require(), so it cannot be made to skip.
      Measured against renv/lib/R/library on 2026-09-30: ALL 29 are now installed and
      available.  Six were added for this purpose - bioconductor-complexheatmap (which
      brings circlize and DT), r-laplacesdemon, r-tidyverse, r-umap and r-patchwork.  Of
      the 29, five are Bioconductor (flowCore, FlowSOM, limma, ComplexHeatmap,
      ConsensusClusterPlus), 22 are CRAN, and MASS and stats ship with R.  Note that the
      README's own package_installer() list also names DT, randomcoloR, shinyjs,
      shinycssloaders and shinyWidgets, but those are reached only through
      CytoBatchFlagR_workflow.R and the Shiny helpers, which this adapter deliberately
      never sources (see adapter_strategy); they are therefore neither enforced nor
      installed, and widening the surface for code that cannot run would be a cost with
      no benefit.
      TWO PRECONDITIONS ARE NOT IN UPSTREAM'S SIGNATURE, and both are load-bearing.
      neg_mfi_df_all and pos_mfi_df_all default to min_cells=TRUE, which SILENTLY drops
      any control with fewer than 100 cells for a marker, and percent_pos_df_all has no
      min_cells argument at all (passing one aborts with "unused argument").  The
      wrapper therefore passes min_cells=FALSE and this adapter enforces its own floor,
      MIN_CELLS_PER_CONTROL_MARKER = 100 -- upstream's number, adopted rather than
      invented -- returning `ineligible` when a panel is too thin, because a short panel
      is UNANSWERABLE and reporting it as a clean result is the fabricated-negative case.
      SECOND, the 1.5-IQR fence is not specific at realistic batch counts: measured over
      400,000 draws it fires on four values with probability 0.207 per test (0.0515 per
      value), and it does NOT improve with more batches (0.27 at six, 0.27 at eight, 0.30
      at twenty).  "No flags" is therefore NOT evidence of absence, and a reader must not
      treat it as such.  CytoBatchFlagR R code DOES now execute:
      tests/integration/test_cytobatchflagr_backend.py drives the real detector through
      run_r_script and asserts the differential - the shifted batch flagged, the same
      design unshifted not flagged.

  openproblems_cyto_batch_integration:
    repository: https://github.com/openproblems-bio/task_cyto_batch_integration
    commit: "37151479aaa89edf37ae23068de8fbb41a1b7bb4"
    branch: main
    version: "unreleased (CHANGELOG header reads x.y.z)"
    language: Python and R, packaged as Viash components
    distribution: Viash components executed through Nextflow
    licence: MIT
    licence_file: LICENSE
    licence_allows_reuse: true
    adapter_strategy: >-
      Components are extracted from their Viash `helper.py` / `helper.R` files and
      verified against the pinned source.  The Nextflow runtime is NOT required: each
      helper is an ordinary module with plain imports, and the verification tests
      import the pinned file directly and compare outputs.  As of 2026-09-30 SIX
      components are extracted and registered in the `compatibility` namespace with
      `upstream_verified=True`: emd_mean_ct_horiz, emd_mean_ct_vert,
      ratio_consistent_peaks, average_batch_r2_ct, iLisi and cLisi.
      average_batch_r2_ct was first written as a reimplementation in `common`, because
      the pinned helper needs scikit-learn; once scikit-learn and scib-metrics were
      declared in the `metrics` extra the comparison exposed that the single-contrast fit
      was a DIFFERENT model from the pinned `get_dummies(drop_first=True)`, so it was
      corrected to a full per-batch dummy block and promoted rather than left as a
      lookalike.  Three rows stay deferred with the specific obstacle named, and nothing
      claims to be a compatibility component without a test that runs both
      implementations on a shared fixture.
    metrics_present_at_commit:
      - average_batch_r2_ct
      - emd_mean_ct_horiz
      - emd_mean_ct_vert
      - flowsom_mean_mapping_similarity
      - functional_marker_preservation_wilcoxon
      - functional_marker_preservation_cohens_d
      - iLisi
      - cLisi
      - ratio_consistent_peaks
    metrics_named_in_plan_but_absent:
      - name: cms
        detail: >-
          The CHANGELOG records "Added metrics/cms (PR #79)" and a later entry about
          parallelising it, but src/metrics/cms does not exist at this commit.  Treat
          the CellMixS-based metric as unavailable rather than as something to
          reconcile against.

  spiscy:
    repository: https://github.com/emilier17/spiscy
    commit: a6e55c8f722112bf01d5364996b1867844efbd02
    branch: main
    language: Snakemake workflow
    distribution: repository only; no release, no publication located
    licence: MIT
    licence_file: LICENSE
    licence_allows_reuse: true
    adapter_strategy: >-
      Reference reading for workflow layout and PeacoQC integration patterns, and now
      also a contract: the 2-D gate table, the per-panel asinh transform and the
      PeacoQC QC pass are built against the shapes SPiSCy's own config files declare,
      and tests load `02_prelim_gating.yaml` and `06_QC.yaml` UNCHANGED from the pinned
      checkout and assert this build accepts them.  The transformation is the unscaled
      `asinh(x / cofactor)`, verified element-wise against `flowVS::transFlowVS` at the
      pinned Bioconductor version, because that convention is what `io/export.py` inverts
      exactly.  SPiSCy has no logicle at all (zero matches in the checkout), so none is
      implemented here either.  Nothing from SPiSCy's own R is vendored; its scripts are
      read, and PeacoQC itself is an independent Bioconductor package.
    adapter_calls:
      # workflow/scripts/peacoqc_qc.R calls the exported function directly.
      - PeacoQC
      # Called by no script of ours: it exists so
      # tests/integration/test_peacoqc_backend.py can run the upstream transform in R
      # and compare it against this build's, so the call is declared rather than silent.
      - flowVS.transFlowVS
